<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">WeAct STM32G030 — FreeRTOS and SystemView</title>
  <desc id="desc">An original chip and task-timeline emblem for the Duke-derived STM32G030 project, using VS Code and Pico/yapicoprobe for live RTT trace.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101c32"/><stop offset="1" stop-color="#07131f"/></linearGradient>
    <linearGradient id="chip" x2="1" y2="1"><stop stop-color="#163c4a"/><stop offset="1" stop-color="#0d2334"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#51e2c4"/><stop offset="1" stop-color="#59a6ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#55728d" stroke-opacity=".1"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#background)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="398" rx="23" fill="none" stroke="#2a4157"/>
  <rect x="56" y="48" width="44" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="112" y="57" fill="#91a9bf" font-size="15" font-weight="600" letter-spacing="3">THE WEACT TRACE LAB</text>
    <text x="52" y="151" fill="#f3f8ff" font-size="72" font-weight="700" letter-spacing="-2">STM32G030</text>
    <text x="56" y="207" fill="#57e2c4" font-size="36" font-weight="600">FreeRTOS + SystemView</text>
    <text x="57" y="253" fill="#b0c3d5" font-size="23">Build. Debug. Watch your tasks come alive.</text>
    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="56" y="291" width="116" height="38" rx="19" fill="#192f46" stroke="#334e6b"/><text x="114" y="316" fill="#e4effc">VS Code</text>
      <rect x="184" y="291" width="210" height="38" rx="19" fill="#102f34" stroke="#24685c"/><text x="289" y="316" fill="#78ebd2">Pico / yapicoprobe</text>
      <rect x="406" y="291" width="146" height="38" rx="19" fill="#30291f" stroke="#6b5431"/><text x="479" y="316" fill="#ffd18b">Live RTT trace</text>
    </g>
    <text x="57" y="369" fill="#7893ac" font-size="14" letter-spacing=".5">DUKE TUTORIAL ROOTS. SMALL BOARD. REAL HARDWARE.</text>
  </g>
  <!-- Original microcontroller emblem: no vendor logos or external resources. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#24465a" stroke-width="3">
      <path d="M934 118H856V79H790M934 150H816V190H768M934 182H874V228H799"/>
      <path d="M1098 118H1150V71H1206M1098 150H1216M1098 182H1154V229H1215"/>
      <circle cx="790" cy="79" r="5"/><circle cx="768" cy="190" r="5"/><circle cx="799" cy="228" r="5"/>
      <circle cx="1206" cy="71" r="5"/><circle cx="1216" cy="150" r="5"/><circle cx="1215" cy="229" r="5"/>
    </g>
    <g stroke="#5e96a7" stroke-width="7">
      <path d="M962 77V61M998 77V61M1034 77V61M1070 77V61M962 229V245M998 229V245M1034 229V245M1070 229V245"/>
      <path d="M940 99H924M940 135H924M940 171H924M940 207H924M1092 99H1108M1092 135H1108M1092 171H1108M1092 207H1108"/>
    </g>
    <rect x="940" y="77" width="152" height="152" rx="18" fill="url(#chip)" stroke="#56dfc2" stroke-width="2"/>
    <rect x="952" y="89" width="128" height="128" rx="10" stroke="#2b5868"/>
    <path d="M966 186H983V171H1001V193H1018V178H1040V186H1066" stroke="url(#accent)" stroke-width="3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="1016" y="153" fill="#eefbff" font-size="49" font-weight="700">G0</text>
    <text x="1016" y="269" fill="#7ba9bb" font-size="12" letter-spacing="2">SWD → RTT → TRACE</text>
  </g>
  <!-- Task bars evoke trace data; they are an emblem, not measured results. -->
  <g transform="translate(811 291)">
    <rect width="410" height="69" rx="10" fill="#0b1927" stroke="#263e53"/>
    <g stroke="#253e52" stroke-dasharray="2 6"><path d="M97 10V59M165 10V59M233 10V59M301 10V59M369 10V59"/></g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8ea9bf"><text x="14" y="27">WORK</text><text x="14" y="51">LED</text></g>
    <path d="M77 26H390M77 50H390" stroke="#263e53"/>
    <g fill="#ffbe69"><rect x="91" y="18" width="34" height="13" rx="3"/><rect x="253" y="18" width="34" height="13" rx="3"/></g>
    <g fill="#51dfc0"><rect x="133" y="42" width="10" height="13" rx="3"/><rect x="197" y="42" width="10" height="13" rx="3"/><rect x="297" y="42" width="10" height="13" rx="3"/><rect x="361" y="42" width="10" height="13" rx="3"/></g>
  </g>
</svg>
